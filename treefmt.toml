#:schema https://www.schemastore.org/treefmt.json

[formatter.gleam]
command = "gleam"
options = ["format"]
includes = ["*.gleam"]

[formatter.nixfmt]
command = "nixfmt"
includes = ["*.nix"]

[formatter.oxfmt]
command = "oxfmt"
options = ["--write"]
includes = ["*.json", "*.yaml", "*.toml", "*.md"]
